<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            text-align: center;
            font-size: 35px;
            margin-bottom: 12px;
            margin-top: 20px;
            font-size: larger;
        }
        span{
            border-bottom: 1px solid blue;

        }
        section{
            background-color: rgb(142, 137, 137);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 13px;
            padding: 20px 0px;
        }
        body{
            background-color: azure;
        }
        .card{
            width: 250px;
            text-align: center;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0px 0px 5px rgb(222, 165, 165);
            cursor: pointer;
            transition:pop;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .card:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }
        
        img{
            width: 100%;
            height: 170px;
        }
        h2{
            margin-bottom: 12px;
        }
        p{
            margin-bottom: 10px;
            color: rgb(54, 165, 54);
            font-weight: bold;
        }
        button{
            width:100%;
            padding: 8px 20px;
            background-color: rgb(0, 0, 255);
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            box-shadow: 0px 0px 4px rgb(157, 155, 155);
        }
        article{
            padding: 10px;
            background-color: aliceblue;

        }
        button:hover{
            background-color: black;
            cursor: pointer;
        }
        nav{
            padding: 20px;
            background-color: rgb(71, 48, 48);
            text-align: center;
        }
        nav a{
            color: black;
            font-size: 18px;
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }
        nav a:hover{
            color: yellow;
        }
        footer{
            color: black;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            height: 100%;

        }
    </style>
</head>
<body>
    <nav>
        <a href="">Home</a>
        <a href="">About </a>
        <a href="">Service</a>
        <a href="">Offers</a>
        <a href="">Sign-out</a>
    </nav>
    <div>
        <h1> <span>TRENDING PRODUCTS</span></h1>
    </div>
    <section>
        <div class="card">
            <img src="./haed.png" alt="">
            <article>
             <h2>Head Phones</h2>
             <p>&#8377; 3,500</p>
             <button>Add To Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./watches.png" alt="">
            <article>
             <h2>Watches</h2>
             <p>&#8377; 4,500</p>
             <button>Add To Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./lap.png" alt="">
            <article>
             <h2>Laptops</h2>
             <p>&#8377; 33,500</p>
             <button>Add To Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./speaker.png" alt="">
            <article>
             <h2>JBL Speaker</h2>
             <p>&#8377; 3,500</p>
             <button>Add To Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./mouse.png" alt="">
            <article>
             <h2>Gaming Mouse</h2>
             <p>&#8377; 1,500</p>
             <button>Add To Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./key.png" alt="">
            <article>
             <h2>Keyboard</h2>
             <p>&#8377; 2,900</p>
             <button>Add To Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./mini.png" alt="">
            <article>
             <h2>Mini-Speaker</h2>
             <p>&#8377; 800</p>
             <button>Add To Cart</button>
            </article>
        </div>
        <div class="card">
            <img src="./mic.png" alt="">
            <article>
             <h2>Mic</h2>
             <p>&#8377; 900</p>
             <button>Add To Cart</button>
            </article>
        </div>
    </section>
    <footer>
        @stores.com2026
    </footer>
</body>
</html>
