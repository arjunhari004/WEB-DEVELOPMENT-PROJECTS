<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer{
            border: 1px solid grey ;
            width: 500px ;
            box-shadow: 2px 7px 15px rgb(86, 84, 84) ;
            margin: auto;
            background-color:rgb(193, 192, 192);
            margin-top: 23px;

        }
        img{
            width: 100%;
            height: 450px;

        }
        .inner{
            padding: 15px 35px;
            box-shadow: 2px 6px 10px rgb(57, 54, 54);

        }
        h1{
            font-size: 35px;
            text-shadow: 0px 2px 1.5px rgb(74, 73, 73);
        }
        p{
            color: rgb(75, 72, 72);
            text-align: justify;
        }
        button{
            background-color: rgb(9, 99, 19);
            color: whitesmoke;
            border: none;
            padding: 12px;
            font-size: medium;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="outer">
        <img src="./apple.png" alt="">
        <div class="inner">
            <h1>Is Apple A Design Company</h1>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Sapiente non pariatur minus quasi quaerat sed velit. Tempore inventore perspiciatis suscipit!</p>
            <button>Read More</button>
        </div>
    </div>
</body>
</html>
