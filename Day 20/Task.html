<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
       
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        section{
            border: 2px solid grey;
            display: flex;
            width: 300px;
            border-radius: 22px;
            overflow: hidden;
           
            
        }
        .discount{
            color: white;
            background-color: green;
            border-radius: 3px;
            position: absolute;
            align-content: start;
            
        }
        img{
            width: 100%;
            position:relative;
        }
        
        .star{
            color: green;
        }
        .discount{
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: green;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        article{
            padding: 12px;
        }
        .inner{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
         }
        .price{
           padding: 8px 0;
        }

        .price p{
         margin-bottom: 10px;
        }
       .outer{
            position: relative;
        }
        button{
            margin-top: 10px;
            border: 2px solid rgb(24, 123, 24);
            background: white;
            color: green;
            border-radius: 12px;
            width: 100%;
            padding: 12px;
            cursor: pointer;
        }
        .time{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        h5{
            color: black;
        }
       

    </style>

</head>

<body>
    <section>
        <div class="outer">
            <img src="./burger.png" alt="">
            <span class="discount">30% OFF</span>
            
            <article>
                <div class="inner">
                <h2>Burger House</h2>
                <h5><span class="star">&star;</span>4.3</h5>
                </div>
               <p>American, Fast Food</p>
            <div class="time">
               <p><i class="fa-regular fa-clock"></i> 30-40 mins</p>
               <p><i class="fa-solid fa-person-biking"></i> Free Delivery</p>
            </div>
                <button>View Menu</button>
            </article>
            
        </div>
    </section>
</body>
</html>
