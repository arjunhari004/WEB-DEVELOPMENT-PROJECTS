<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px solid rgb(192, 185, 185);
            height: 560px;
            background-image: url(./WORLD.png);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            position: relative;
            margin: 50px auto;
            border-radius: 25px;
            box-shadow: 20px;

        }
        .content{

            position: absolute;
            top: 50px;
            left: 25%;
            color: rgb(97, 33, 3);
            font-size: 35px;
            font-family: Georgia, 'Times New Roman', Times, serif ;

        }
        button{
            padding: 10px 20px ;
            margin-left: 10%;
            font-size: 20px;
            background-color: brown;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: aliceblue;
            border-radius: 30px;
            border: none;

        }
    </style>
</head>
<body>
    <div class="container">

    </div>
    <div class="content">
      <h1>WELCOME TO WORLD OF TSUSHIMA</h1>
      <button>WATCH NOW</button>

    </div>

</body>
</html>
