<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url(./tree.png);
            
        }
        .container{
            border: 2px solid rgb(192, 185, 185);
            height: 560px;
            background-image: url(./neww.png);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            position: relative;
            margin: 50px auto;
            border-radius: 25px;
            box-shadow: 20px;

        }
        .content{

            position: absolute;
            top: 50px;
            /* left: 25%; */
            color: rgb(165, 110, 110);
            font-size: 35px;
            font-family: Georgia, 'Times New Roman', Times, serif ;
            text-align: center;

        }
        button{
            padding: 10px 20px ;
            margin-left: 0%;
            font-size: 20px;
            background-color: rgb(212, 199, 199);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: rgb(0, 0, 0);
            border-radius: 10px;
            border: none;

        }
    </style>
</head>
<body>
    <marquee behavior="" direction="up">
    <div class="container">
        </div>
    <div class="content">
    <h1>A NEW PERSPECTIVE</h1>
    <p>Our Innovative Approach Redefines Industry Standards,Creating Solutions That Are Both Powerful And Elegant.</p>
    <button>Learn More About Us</button>
    </div>
    </marquee>
</body>
</html>
