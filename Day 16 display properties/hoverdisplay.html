<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px solid blue;
            padding: 20px;
            width: 135px;
        }
        .dropdown{
            border: 2px solid green;
            width: 120px;
            background-color: red;
            display: none;
            height: 600px;
        }
        .dropdown a{
            display: block;
            padding: 15px;
            text-decoration: none;
            color: black;

        }
        .dropdown a:hover{
            color: yellow;

        }
        .container:hover .dropdown{
            display: block;
        }
    </style>

</head>
<body>
    <div class="container">
        <button>Products</button>
        <div class="dropdown">

        <a href="">Laptops</a>
        <a href="">Watches</a>
        <a href="">Phones</a>
        <a href="">Shoes</a>

        </div>
        
    </div>
</body>
</html>
