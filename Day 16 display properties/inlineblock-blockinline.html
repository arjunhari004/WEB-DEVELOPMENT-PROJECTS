<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            display: inline;
            height: 300px;
            width: 500px;
            background-color: antiquewhite;
        }
        span{
             display:block;
            height: 300px;
            width: 500px;
            background-color: blue;
        }
        p{
            display: inline-block;
            height: 100px;
            width: 100px;
            background-color: yellow;
            padding: 10px;
            margin: 20px;
            text-align: center;
        }

    </style>
</head>
<body>
    <!-- div is actually a block level element , and when we use display:inline;  and the div now acts as inline level element-->
    <div>huhhhh</div>
    <!-- span is inline level element and when we use display:block; it behaves like block level elemnt -->
    <span>inline element</span>
    
    <p>firsttt</p>
    <p>second</p>
    <p>thirdd</p>
    <p>Fourth</p>
    <p>Fifthh</p>

</body>
</html>
