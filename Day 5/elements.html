<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p::before{
            content: "😍";
        }
        p::after{
            content: "📞";
        }
        label::after{
            content: "*";
            color: red;
            font-size: 12px;

        }
         li::marker{
            content: "💪";
         }
    </style>
</head>
<body>

    <label for="">Username:</label>
