<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;


        }
        nav{
            border: 2px solid grey;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            background-color: black;
        }

        .logo{
            color: white;
            padding: 0 8px;


        }
        .content{
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 0 8px;
            
        }
        .logo:hover{
            color: yellow;
            cursor: pointer;
        }
        .content a{
            color: rgb(246, 246, 238);
        }
        .content a:hover{
            color: yellow;
        }
        .middle{
            justify-content: center;
            /* display: flex; */
             display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <h2>JSPIDERS</h2>
        </div>
        <div class="content">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
            <a href="">Logout</a>
        </div>
    </nav>
    <section>
    <div class="middle">

        <h1>WELCOME TO JSPIDERS</h1>

    </div>
    </section>
    <footer>
        <H2>QSPIDERS</H2>
    </footer>
</body>
</html>
