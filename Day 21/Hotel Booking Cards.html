<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking Cards</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background-image:url("./back.png");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            padding:30px;
        }

        nav{
            text-align:center;
            background:aliceblue;
            padding:15px;
            border-radius:10px;
            margin-bottom:30px;
        }

        .ok{
            color:brown;
            text-decoration:underline;
        }
        section{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:25px;
        }
        .outer{
            width:280px;
            background:white;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 4px 15px rgba(0,0,0,0.15);
            position:relative;
            transition:.3s;
        }
        .outer:hover{
            transform:translateY(-8px);
        }

        img{
            width:100%;
            height:200px;
            object-fit:cover;
            display:block;
        }
        .discount{
            position:absolute;
            top:12px;
            left:12px;
            background:green;
            color:white;
            padding:6px 10px;
            border-radius:5px;
            font-size:13px;
            font-weight:bold;
        }
        article{
            padding:15px;
            background:white;
        }
        article h3{
            margin-bottom:10px;
        }

        .rating{
            color:green;
            margin-bottom:10px;
        }
        .place{
            display:flex;
            align-items:center;
            gap:8px;
            color:#555;
            margin-bottom:12px;
        }

        .facilities{
            display:flex;
            justify-content:space-between;
            margin-bottom:15px;
            font-size:14px;
            color:#444;
        }

        .facilities span{
            display:flex;
            align-items:center;
            gap:5px;
        }

        .price{
            font-size:22px;
            font-weight:bold;
            margin-bottom:15px;
            color:#222;
        }

        button{
            width:100%;
            padding:12px;
            border:2px solid green;
            background:white;
            color:green;
            font-size:16px;
            border-radius:10px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:green;
            color:white;
        }
    </style>
</head>

<body>

    <nav>
        <h1>HOTEL BO<span class="ok">OK</span>ING CARDS</h1>
    </nav>

    <section>
        <div class="outer">
            <img src="./ho1.png" alt="Hotel">
            <span class="discount">
                Free Breakfast
            </span>
            <article>

                <h3>Palm Paradise Resort</h3>

                <p class="rating">
                    <i class="fa-solid fa-star"></i>
                    4.6 (960 Reviews)
                </p>

                <div class="place">
                    <i class="fa-solid fa-location-dot"></i>
                    Bali, Indonesia
                </div>

                <div class="facilities">

                    <span>
                        <i class="fa-solid fa-wifi"></i>
                        WiFi
                    </span>

                    <span>
                        <i class="fa-solid fa-water-ladder"></i>
                        Pool
                    </span>
                    <span>
                        <i class="fa-solid fa-spa"></i>
                        Spa
                    </span>
                </div>
                <div class="price">
                    ₹4,799 / night
                </div>
                <button>View Details</button>
            </article>
        </div>
    </section>
</body>
</html>
