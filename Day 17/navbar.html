<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            border: 1px solid;
            padding: 20px;
            background-color: rgb(67, 175, 0);
            /* box-shadow: 2px 3px 5px; */
            /* margin-top: 12px; */

        }
        .container{
            display: inline-block;
            position: relative;
        }
        .dropdown{
            border: 1px solid grey;
            background-color: white;
            display: none;
            position: absolute;
            top: 26px;
            left: 0;

        }
        .dropdown a{
            display: block;
            text-decoration: none;
            border-bottom: 1px solid;
            padding: 6px 10px;
        }
        .container:hover .dropdown{
            display: block;
        }
        nav>a,.container>a{
            color: white;
            margin-right: 15px;
            font-size: 18px;
            text-decoration: none;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <nav>
        <a href="">Home</a>
        <div class="container">
            <a href="">Products</a>
        
        <div class="dropdown">
        <a href="">Laptops</a>
        <a href="">Watches</a>
        <a href="">Mobiles</a>
        <a href="">Accessories</a>
        </div>
        </div>
        <a href="">Offers</a>
        <a href="">Contact</a>
    </nav>
</body>
</html>
