<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 1px solid grey;
            width: 200px;
            margin: auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 2px 6px 7px;
        }
        .dropdown{
            width: 160px;
            padding: 12px;
            height: 120px;
            margin: auto;
            text-align: center;
            display: none;
        }
        img{
            width: 100%;
            height: 150px;
            display: block;


        }
        button{
            border: none;
            padding: 7px 16px;
            background-color: rgb(154, 101, 22);
            border-radius: 10px;
            color: aliceblue;
        }
        .container:hover .dropdown{
            display: block;

        }
        button:hover{
            cursor: pointer;
        }
        span{
            color: goldenrod;
        }
    </style>
</head>
<body>
    <marquee behavior="" direction="up">
    <div class="container">
        <img src="./jana.png" alt="">
        <div class="dropdown">
            <p>Jana Nayagan</p>
            <p><span>&star;&star;&star;&star;&star;</span>10/10</p>
            <button>Book Tickets</button>

        </div>
    </div>
    </marquee>
</body>
</html>
