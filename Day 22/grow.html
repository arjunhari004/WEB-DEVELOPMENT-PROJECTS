<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        nav{
            display: flex;
            padding: 10px;
            gap: 8px;
            align-items: center;
            background-color: black;
            color: white;
        }
        nav a{
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
        .logo{
            font-size: 20px;
            font-weight: bold;
            padding: 6px;

        }
        .search{
            border: 2px solid red;
            flex-grow: 1;
            border-radius: 10px;
        }
        .search input{
            width: 100%;
            padding: 6px;
            border-radius: 7px;
            border: none;
            outline: none;
        }
        button{
            background-color: orangered;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Logo
        </div>
         <a href="">Home</a>
            <a href="">Offers</a>
            <div class="search">
                <input type="text" placeholder="Search Products">
            </div>
            <button>Cart</button>
    </nav>
</body>
</html>
