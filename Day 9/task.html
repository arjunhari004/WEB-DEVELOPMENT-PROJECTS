<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            background-color: rgb(222, 208, 190);
        }

        div{
            border: 2px solid grey;
            width: 320px;
            padding: 20px;
            margin: 50px auto ;
            border-radius: 13px;
            background-color: #ebe5e5;
            box-shadow: 2px 3px 6px rgb(84, 81, 81);
            padding-right: 40px;
        }
        input{
            width: 100%;
            padding: 10px;
            margin-bottom: 13px;
            border-radius: 8px;
            border: none;
            outline: none;
            border: 1px solid grey;
        }
        button{
            padding-top: 7px;
            padding-bottom: 7px;
            padding-left: 20px;
            padding-right: 20px;
            margin-top: 15px;
            background-color: green;
            color: aliceblue;
            width: 100%;
            border:none;
            border-radius: 8px;
            font-size: 16px;
        }
        button:hover{
            background-color: black;
            cursor: pointer;

        }
        div:hover{
            background-color: rgb(104, 161, 210);
        }
    </style>
</head>
<body>
    <div>
        <h2>Login</h2>
        <input type="text" placeholder="Enter Your Name">
        <input type="text" placeholder="Enter Password">
        <button>Login</button>
    </div>
</body>
</html>
